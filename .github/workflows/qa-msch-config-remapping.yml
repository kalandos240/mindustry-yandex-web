name: QA native MSCH contentMap remapping

on:
  pull_request:
    paths:
      - scripts/verify-native-schematic-clipboard.py
      - .github/workflows/qa-msch-config-remapping.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-msch-configured-item:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen compiled source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/40180099301 --jq '.head_sha')"
          test "$actual" = 654d1921e59447a0880f72e6124361a12276b536
          echo "Using TeaVM binary from fixed schematic reader source $actual"

      - name: Download exact compiled browser ZIP from fixed MSCH PR
        uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 40180099301
          github-token: ${{ github.token }}
          path: work/msch-source

      - name: Verify SHA256 and stage byte-identical binary
        run: |
          (cd work/msch-source && sha256sum -c mindustry-yandex-release.zip.sha256)
          mkdir -p web-runtime/build/web
          unzip -q work/msch-source/mindustry-yandex-release.zip -d web-runtime/build/web
          test -s web-runtime/build/web/mindustry.js
          test -s web-runtime/build/web/assets/sprites/sprites.png

      - name: Install Playwright
        run: python3 -m pip install playwright

      - name: Run real desktop and mobile configured schematic import/export
        run: python3 scripts/verify-native-schematic-clipboard.py

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msch-config-remap-browser-evidence
          path: work/schematic-clipboard-qa/
          if-no-files-found: ignore
