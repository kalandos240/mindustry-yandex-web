name: Saved sector native Go diagnosis
on:
  push:
    branches: [native-sector-return-diagnosis]
    paths: ['.github/workflows/native-sector-return.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-original-research-playtest
          run-id: 39097396561
          github-token: ${{ github.token }}
          path: work/release
      - name: Extract exact reported build and trace throws
        run: |
          (cd work/release && sha256sum -c mindustry-yandex-release.zip.sha256)
          mkdir -p web-runtime/build/web
          unzip -q work/release/mindustry-yandex-release.zip -d web-runtime/build/web
          python3 scripts/debug-browser-runtime.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web-runtime/build/web/mindustry.js')
          s=p.read_text()
          start=s.index('mw_BrowserCampaignRuntime_saveCampaignCheckpoint =')
          at=s.index('        if (mw_BrowserCampaignRuntime_current === null)',start)
          fixture="""        if(new URLSearchParams(location.search).has('lostCore') && !globalThis.__lostCoreFixture){
                      globalThis.__lostCoreFixture=true;
                      const core=mg_Team_core(m_Vars_state.$rules2.$defaultTeam);
                      mw_Tile_setBlock(core.$tile5,mc_Blocks_air);
                      if($rt_suspending()) throw new Error('Lost-core fixture unexpectedly suspended');
                      setTimeout(()=>mc_GameState_set(m_Vars_state,mc_GameState$State_paused),0);
                      console.info('LOST_CORE_FIXTURE',mg_Team_core(m_Vars_state.$rules2.$defaultTeam)===null);
                  }
          """
          s=s[:at]+fixture+s[at:]
          p.write_text(s)
          PY
      - name: Native Onset Ground Zero and back through saved-sector Go buttons
        env:
          MINDUSTRY_CDP_CONSOLE: '1'
        run: |
          set -o pipefail
          bash scripts/verify-browser-cold-sector-go.sh 2>&1 | tee work/native-sector-return.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sector-return-diagnosis
          path: |
            work/native-sector-return.log
            /tmp/mindustry-hud-planet.html
            work/menu-ui/*.png
            work/cold-*
