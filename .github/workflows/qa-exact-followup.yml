name: Exact rebuilt game focused acceptance
on:
  push:
    branches: [qa/exact-build-acceptance-20261025]
    paths: [.github/workflows/qa-exact-followup.yml, scripts/verify-settings-functional.py, scripts/verify-native-data-reset.py]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [reset-campaign, reset-research, reset-saves, reset-planet-research, reset-planet-campaign]
    steps:
      - uses: actions/checkout@v4
      - name: Await exact source's experimental package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url="https://api.github.com/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/runs/40163446863/artifacts?per_page=100"
          for attempt in range(90):
              request=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request,timeout=20) as response:
                  found=json.load(response)["artifacts"]
              if any(a["name"]=="mindustry-yandex-manual-playtest-experimental" and not a["expired"] for a in found):
                  print("Exact experimental build artifact available",flush=True)
                  break
              if attempt%6==0:print("Waiting for rebuilt TeaVM artifact",flush=True)
              time.sleep(10)
          else:raise SystemExit("New compiled build never produced a playable archive")
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 40163446863
          name: mindustry-yandex-manual-playtest-experimental
          github-token: ${{ github.token }}
          path: work/new-build
      - name: Validate exact compiled source, byte budget and staging
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path,PurePosixPath
          base=Path('work/new-build')
          # pull_request builds checkout GitHub's synthetic merge commit,
          # whose parents are the pinned base and requested PR head.
          # Verified merge bd7a96f has parent 4864a74 (the fixed port).
          assert 'bd7a96fce75118e6b2ddb4e9a84ee7a3fbdc1a16' in (base/'EXPERIMENTAL-PLAYTEST-NOT-APPROVED.txt').read_text()
          archive=base/'mindustry-yandex-release.zip'
          wanted=(base/'mindustry-yandex-release.zip.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==wanted
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              assert sum(x.file_size for x in z.infolist())<=100_000_000
              for name in z.namelist():
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and not name.endswith('.map')
              z.extractall('web-runtime/build/web')
          print('Candidate byte-valid, not yet accepted:',wanted,flush=True)
          PY
      - name: Install native-browser QA runtime
        run: python3 -m pip install playwright websocket-client
      - name: Run native scenario
        env:
          SUITE: ${{ matrix.suite }}
          PYTHONUNBUFFERED: '1'
        run: |
          case "$SUITE" in
            custom) bash scripts/verify-browser-custom-game.sh ;;
            inventory) python3 scripts/verify-ui-control-inventory.py ;;
            reset-campaign) python3 scripts/verify-native-data-reset.py --target 'Clear Campaign Saves' ;;
            reset-research) python3 scripts/verify-native-data-reset.py --target 'Clear Research' ;;
            reset-saves) python3 scripts/verify-native-data-reset.py --target 'Clear Saves' ;;
            reset-planet-research) python3 scripts/verify-native-data-reset.py --planet --target 'Clear Planet Research' ;;
            reset-planet-campaign) python3 scripts/verify-native-data-reset.py --planet --target 'Clear Planet Campaign Saves' ;;
            reset-all) python3 scripts/verify-native-data-reset.py --target 'Clear Game Data...' ;;
            settings-desktop|settings-mobile)
              python3 scripts/prepare-qa-probe.py
              python3 scripts/prepare-ui-control-probe.py
              if [ "$SUITE" = settings-mobile ]; then
                python3 scripts/verify-settings-functional.py --browser chromium --mobile
              else
                python3 scripts/verify-settings-functional.py --browser chromium
              fi
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-followup-${{ matrix.suite }}
          path: |
            work/native-data-reset/
            work/ui-control-inventory/
            work/settings-functional/
            work/menu-ui/
          if-no-files-found: ignore
