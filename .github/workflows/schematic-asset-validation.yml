name: Validate registered schematic preview on exact rebuild
on:
  push:
    branches: [qa/schematic-asset-validation-20261025]
    paths: [.github/workflows/schematic-asset-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case: [schematic, custom-game, save-library]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PR 182 exact source rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://api.github.com/repos/kalandos240/mindustry-yandex-web/actions/runs/40166564809/artifacts?per_page=100'
          for step in range(140):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20) as response: entries=json.load(response)['artifacts']
              if any(x['name']=='mindustry-yandex-manual-playtest-experimental' and not x['expired'] for x in entries):break
              if step%8==0:print('Await compiled exact GitHub PR-merge build',step,flush=True)
              time.sleep(10)
          else:raise SystemExit('PR #182 did not provide an exact compiled archive')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 40166564809
          name: mindustry-yandex-manual-playtest-experimental
          github-token: ${{ github.token }}
          path: work/compiled
      - name: Verify immutable merge identity and extract exact package
        run: |
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path,PurePosixPath
          base=Path('work/compiled')
          notice=(base/'EXPERIMENTAL-PLAYTEST-NOT-APPROVED.txt').read_text()
          assert '7647597eb35d412b95a9074a821001b0558d755d' in notice,notice
          archive=base/'mindustry-yandex-release.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==(base/'mindustry-yandex-release.zip.sha256').read_text().split()[0]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert len(z.namelist())==len(set(z.namelist()))
              assert sum(p.file_size for p in z.infolist())<=100_000_000
              for name in z.namelist():
                  p=PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and not name.endswith('.map')
              assert 'assets/sprites/schematic-background.png' in z.namelist()
              assert b'sprites/schematic-background.png' in z.read('assets-manifest.js')
              z.extractall('web-runtime/build/web')
          print('Exact source and native schematic bitmap verified',flush=True)
          PY
      - name: Install browser test dependencies
        run: python3 -m pip install playwright
      - name: Verify actual Chrome native controls and no new frame errors
        env:
          SCENARIO: ${{ matrix.case }}
          PYTHONUNBUFFERED: '1'
        run: |
          case "$SCENARIO" in
            schematic) python3 scripts/verify-native-schematic-clipboard.py ;;
            custom-game) bash scripts/verify-browser-custom-game.sh ;;
            save-library) python3 scripts/verify-native-save-library.py ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-schematic-bitmap-${{ matrix.case }}
          path: |
            work/schematic-clipboard-qa/
            work/save-library-qa/
            work/menu-ui/
          if-no-files-found: ignore
