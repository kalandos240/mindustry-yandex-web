name: Firefox defeat and settings regression on exact game ZIP
on:
  push:
    branches: [defeat-settings-fix]
    paths: ['.github/workflows/defeat-settings-firefox.yml']
permissions:
  contents: read
  actions: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native Firefox
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps firefox
      - name: Wait for exact compiled package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import urllib.request,json,os,time
          for attempt in range(60):
              u='https://api.github.com/repos/kalandos240/mindustry-yandex-web/actions/runs/39196095616/artifacts'
              r=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(r,timeout=30) as f: data=json.load(f)
              found=[a for a in data['artifacts'] if a['name']=='mindustry-yandex-manual-playtest-experimental']
              if found:
                  assert found[0]['workflow_run']['head_sha']=='7f78cb2aeb178dfafeaef7099b2dfd636d4888f9'
                  break
              time.sleep(15)
          else: raise SystemExit('Compiled package unavailable')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 39196095616
          github-token: ${{ github.token }}
          path: work/package
      - name: Extract unchanged package
        run: |
          (cd work/package && sha256sum -c mindustry-yandex-release.zip.sha256)
          mkdir -p web-runtime/build/web
          unzip -q work/package/mindustry-yandex-release.zip -d web-runtime/build/web
      - name: Real Firefox settings and defeat input
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOZ_WEBRENDER: '1'
        run: xvfb-run -a python3 scripts/verify-firefox-defeat-settings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-defeat-settings-evidence
          path: work/firefox-defeat-*.png
