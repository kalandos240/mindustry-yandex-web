name: QA real MSCH native menu and clipboard roundtrip

on:
  pull_request:
    paths:
      - scripts/verify-native-schematic-clipboard.py
      - .github/workflows/qa-native-schematic-frozen.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-schematic-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable candidate compiled source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/40198354238 --jq '.head_sha')"
          test "$actual" = 6577e53b59484322207087fc3e4a7c2d6d090cea
          echo "The ZIP is a real TeaVM build from ${actual}."
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 40198354238
          github-token: ${{ github.token }}
          path: work/frozen-schematic-input
      - name: Stage unmodified browser ZIP with SHA-256 check
        run: |
          (cd work/frozen-schematic-input && sha256sum -c mindustry-yandex-release.zip.sha256)
          mkdir -p web-runtime/build/web
          unzip -q work/frozen-schematic-input/mindustry-yandex-release.zip -d web-runtime/build/web
          test -s web-runtime/build/web/mindustry.js
          sha256sum web-runtime/build/web/mindustry.js > work/pristine-schematic-runtime.sha256
      - name: Install browser for real Arc native interactions
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Native MSCH contentMap remap, clipboard and FileReader
        env:
          PYTHONUNBUFFERED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 scripts/verify-native-schematic-clipboard.py
      - name: Verify original game JS restored exactly
        if: always()
        run: sha256sum -c work/pristine-schematic-runtime.sha256
      - name: Preserve screenshot and UI evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: true-native-msch-evidence
          path: work/schematic-clipboard-qa/
          if-no-files-found: ignore
