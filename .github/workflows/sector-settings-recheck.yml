name: Verify exact sector/settings game archive
on:
  push:
    branches: [sector-settings-recovery]
    paths: ['.github/workflows/sector-settings-recheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [loss, settings, cold, progression]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact sector-loader build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json,urllib.request,os,time
          for attempt in range(90):
              request=urllib.request.Request('https://api.github.com/repos/kalandos240/mindustry-yandex-web/actions/runs/39760840880/artifacts',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(request,timeout=30) as f: data=json.load(f)
              matches=[a for a in data['artifacts'] if a['name']=='mindustry-yandex-manual-playtest-experimental']
              if matches:
                  assert matches[0]['workflow_run']['head_sha']=='1d139adb3582e15f87c2429d6116690b6d329a3e'
                  break
              time.sleep(10)
          else: raise SystemExit('Exact compiled game unavailable')
          PYCODE
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 39760840880
          github-token: ${{ github.token }}
          path: work/package
      - name: Verify and extract immutable complete game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          p=Path('work/package/mindustry-yandex-release.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==Path(str(p)+'.sha256').read_text().split()[0]
          with ZipFile(p) as z:
              assert z.testzip() is None
              assert 'index.html' in z.namelist()
              assert sum(i.file_size for i in z.infolist())<100_000_000
              assert len(z.read('mindustry.js'))<=41_200_000
              z.extractall('web-runtime/build/web')
          PY
      - name: Run native browser regression suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            loss)
              bash scripts/verify-browser-defeat-exit.sh ;;
            settings)
              bash scripts/verify-browser-settings-tab-stress.sh
              bash scripts/verify-browser-campaign-save-resume.sh
              bash scripts/verify-browser-gameplay-button-stress.sh ;;
            cold)
              MINDUSTRY_LOST_CORE=1 bash scripts/verify-browser-cold-sector-go.sh
              CLOCK_DEVICES=mobile CLOCK_SECTORS=onset bash scripts/verify-browser-save-clock-go.sh ;;
            progression)
              bash scripts/verify-browser-campaign-capture.sh
              bash scripts/verify-browser-erekir-progression.sh ;;
            *) exit 1 ;;
          esac
      - name: Verify every staged fixture restored the production JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('work/package/mindustry-yandex-release.zip') as z:
              assert z.read('mindustry.js')==Path('web-runtime/build/web/mindustry.js').read_bytes()
          print('Production JavaScript unchanged by fixtures PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-settings-${{ matrix.suite }}-evidence
          path: |
            work/defeat-*.html
            work/defeat-*.png
            work/settings-*.html
            work/settings-*.png
            work/cold-*.html
            work/cold-*.png
            work/*clock*.html
            work/*clock*.png
          if-no-files-found: warn
  verified:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 39760840880
          github-token: ${{ github.token }}
          path: work/package
      - name: Confirm exact full game identity
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('work/package/mindustry-yandex-release.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==Path(str(p)+'.sha256').read_text().split()[0]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mindustry-defeat-settings-verified
          path: |
            work/package/mindustry-yandex-release.zip
            work/package/mindustry-yandex-release.zip.sha256
            work/package/mindustry-yandex-release-report.txt
          if-no-files-found: error
