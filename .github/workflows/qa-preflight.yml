name: QA lexical runtime and live browser preflight
on:
  push:
    branches: [sector-settings-recovery]
    paths: ['.github/workflows/qa-preflight.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        suite: [inventory, portal-chromium, portal-firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test functional scheduling, scale and SDK lookup policies
        run: |
          python3 scripts/test-browser-frame-pacing.py
          python3 scripts/test-browser-ui-scale.py
          node scripts/test-yandex-device-info.js
          node scripts/test-ui-control-probe.js
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-renderer-diagnostic-verified
          run-id: 40086065368
          github-token: ${{ github.token }}
          path: work/base
      - name: Stage old runtime and current SDK adapter
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import hashlib
          p=Path('work/base/Mindustry-Yandex-renderer-diagnostic.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='620fb35071755028b6863d4d513bf90cb2449b09726218d2e1f4ed3c6d4e7439'
          with ZipFile(p) as z:z.extractall('web-runtime/build/web')
          Path('web-runtime/build/web/yandex-platform.js').write_bytes(Path('web-runtime/src/web/yandex-platform.js').read_bytes())
          PY
      - name: Prove lexical state-variable compaction and parse the actual runtime
        run: |
          npm install --prefix work/qa-js-parser --no-save --no-package-lock --ignore-scripts --no-audit --no-fund acorn@8.14.1
          node scripts/test-teavm-state-vars.cjs work/qa-js-parser/node_modules/acorn
          node scripts/compact-teavm-state-vars.cjs web-runtime/build/web/mindustry.js work/qa-js-parser/node_modules/acorn
          node --check web-runtime/build/web/mindustry.js
      - run: python3 -m pip install playwright
      - name: Install Firefox
        if: matrix.suite == 'portal-firefox'
        timeout-minutes: 5
        run: python3 -m playwright install --with-deps firefox
      - name: Real native input and world checks
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          MOZ_WEBRENDER: '1'
        run: |
          case '${{ matrix.suite }}' in
            inventory) python3 scripts/verify-ui-control-inventory.py;;
            portal-chromium) python3 scripts/verify-portal-campaign-lifecycle.py --browser chromium --headless --case desktop-combined --case webgl1-combined;;
            portal-firefox) xvfb-run -a python3 scripts/verify-portal-campaign-lifecycle.py --browser firefox --case desktop-default --case mobile-default;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ matrix.suite }}
          path: |
            work/ui-control-inventory
            work/portal-*.html
            work/portal-*.png
            work/portal-*-results.json
