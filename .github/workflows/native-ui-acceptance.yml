name: Fresh packaged UI acceptance
on:
  push:
    branches: [ui-acceptance-d720693]
permissions:
  contents: read
  actions: read
jobs:
  package-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 39064000314
          github-token: ${{ github.token }}
          path: work/package-acceptance/archive
      - name: Verify exact produced ZIP checksum
        working-directory: work/package-acceptance/archive
        run: sha256sum -c mindustry-yandex-release.zip.sha256
      - name: Unpack actual package without runtime patches
        run: python3 -c 'from zipfile import ZipFile; ZipFile("work/package-acceptance/archive/mindustry-yandex-release.zip").extractall("web-runtime/build/web")'
      - name: Original menu and database in desktop/mobile Chrome
        id: menu
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/verify-browser-ui-button-stress.sh 2>&1 | tee work/package-acceptance/menu.log
      - name: Sustained original 3D planets and switching on both devices
        id: planets
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/verify-browser-planet-dialog.sh 2>&1 | tee work/package-acceptance/planets.log
      - name: Actual menu/globe buttons start both real campaign worlds
        id: launch
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/verify-browser-real-campaign-launch.sh 2>&1 | tee work/package-acceptance/launch.log
      - name: Native campaign map pause and cross-planet sector switch
        id: hud
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/verify-browser-hud-planet-stress.sh 2>&1 | tee work/package-acceptance/hud.log
      - name: Native Research and Database close in live campaigns
        id: database
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/verify-browser-research-actions.sh 2>&1 | tee work/package-acceptance/database.log
      - name: Upload actual package test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-package-ui-evidence
          path: |
            work/package-acceptance/*.log
            work/menu-ui/*.png
          if-no-files-found: error
      - name: Require actual outcomes, including continued failure cases
        if: always()
        run: |
          test '${{ steps.menu.outcome }}' = success
          test '${{ steps.planets.outcome }}' = success
          test '${{ steps.launch.outcome }}' = success
          test '${{ steps.hud.outcome }}' = success
          test '${{ steps.database.outcome }}' = success
