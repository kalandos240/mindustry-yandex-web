name: QA frozen-build core loss and settings

on:
  pull_request:
    paths:
      - scripts/verify-browser-defeat-exit.sh
      - scripts/verify-firefox-defeat-settings.py
      - scripts/browser-defeat-exit.js
      - .github/workflows/qa-defeat-settings-frozen.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  core-loss-and-paused-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [chrome-core-loss, firefox-core-loss-settings]
    steps:
      - uses: actions/checkout@v4

      - name: Require frozen browser binary to match the known native MSCH fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/40180099301 --jq '.head_sha')"
          test "$source_sha" = 654d1921e59447a0880f72e6124361a12276b536
          echo "QA is using the exact fixed source SHA: $source_sha"

      - uses: actions/download-artifact@v4
        with:
          name: mindustry-yandex-manual-playtest-experimental
          run-id: 40180099301
          github-token: ${{ github.token }}
          path: work/frozen-candidate

      - name: Verify exact ZIP bytes and stage native browser game
        run: |
          (cd work/frozen-candidate && sha256sum -c mindustry-yandex-release.zip.sha256)
          mkdir -p web-runtime/build/web
          unzip -q work/frozen-candidate/mindustry-yandex-release.zip -d web-runtime/build/web
          test -s web-runtime/build/web/mindustry.js
          test -s web-runtime/build/web/assets/maps/serpulo/groundZero.msav
          test -s web-runtime/build/web/assets/maps/erekir/onset.msav

      - name: Test real core destruction and actionable result on six Chrome surfaces
        if: matrix.suite == 'chrome-core-loss'
        run: bash scripts/verify-browser-defeat-exit.sh

      - name: Install desktop Firefox browser and Playwright dependencies
        if: matrix.suite == 'firefox-core-loss-settings'
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps firefox

      - name: Test native paused settings and Serpulo/Erekir core-loss exit in Firefox
        if: matrix.suite == 'firefox-core-loss-settings'
        run: xvfb-run -a python3 scripts/verify-firefox-defeat-settings.py

      - name: Preserve screenshots and DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-loss-settings-${{ matrix.suite }}
          path: |
            work/defeat-*.png
            work/defeat-*.html
            work/firefox-defeat-*.png
          if-no-files-found: ignore
