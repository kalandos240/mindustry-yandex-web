name: Web port baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-port-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Static-check release and browser test harness
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/audit-campaign-consistency.py
          python3 scripts/audit-browser-hotpath.py
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Bootstrap pinned upstream sources
        run: bash scripts/bootstrap.sh

      - name: Verify legacy browser backend snapshot
        run: |
          test -d work/legacy-arc-web/backends/backend-gwt/src
          count="$(find work/legacy-arc-web/backends/backend-gwt/src -type f -name '*.java' | wc -l)"
          echo "Recovered legacy GWT Java files: $count"
          test "$count" -gt 20

      - name: Compile unmodified Mindustry core baseline
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew core:compileJava --no-daemon --stacktrace

      - name: Generate Web compatibility inventory
        if: always()
        run: bash scripts/audit-web-compat.sh

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-compat-report
          path: work/web-compat-report.txt
          if-no-files-found: error

  web-runtime:
    runs-on: ubuntu-latest
    # This job intentionally executes several full Chrome cold-restart persistence
    # pairs. Fog/weather gates add two more real v13 save/restore cycles, so keep
    # enough headroom for shared-runner startup variance without weakening checks.
    timeout-minutes: 50

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Static-check release and browser test harness
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/audit-campaign-consistency.py
          python3 scripts/audit-browser-hotpath.py
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Bootstrap pinned upstream sources
        run: bash scripts/bootstrap.sh

      - name: Verify pinned built-in Attack map list
        run: python3 scripts/verify-pinned-attack-maps.py

      - name: Audit complete English and Russian localization
        run: |
          python3 scripts/audit-i18n.py
          cat work/web-i18n-report.txt

      - name: Generate pinned vanilla sprite atlas
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew tools:pack '-Pargs=[]' --no-daemon --stacktrace
          test -s core/assets/sprites/sprites.aatls
          test -s core/assets/sprites/sprites.png
          pages="$(find core/assets/sprites -maxdepth 1 -type f -name 'sprites*.png' | wc -l)"
          echo "Vanilla AATLS bytes: $(wc -c < core/assets/sprites/sprites.aatls)"
          echo "Vanilla atlas pages: $pages"
          test "$pages" -gt 0

      - name: Bake browser-safe Mindustry UI fonts
        run: |
          bash scripts/install-web-font-baker.sh
          cd work/Mindustry
          chmod +x gradlew
          ./gradlew tools:webFontBake --no-daemon --stacktrace
          for name in default outline monospace icon iconLarge tech logic; do
            test -s "core/assets/webfonts/$name.fnt"
            test -s "core/assets/webfonts/$name-0.png"
            pages="$(find core/assets/webfonts -maxdepth 1 -type f -name "$name-*.png" | wc -l)"
            echo "Baked font $name: fnt=$(wc -c < "core/assets/webfonts/$name.fnt") bytes pages=$pages"
            test "$pages" -gt 0
          done

      - name: Apply current Web compatibility overlays
        run: |
          bash scripts/apply-port.sh
          python3 scripts/patch-arc-fi-web.py work/Arc/arc-core/src/arc/files/Fi.java
          python3 scripts/patch-mindustry-block-reflection.py work/Mindustry/core/src/mindustry/world/Block.java
          python3 scripts/patch-mindustry-fonts-web.py work/Mindustry/core/src/mindustry/ui/Fonts.java
          python3 scripts/patch-mindustry-no-links-web.py
          python3 scripts/patch-mindustry-external-urls-web.py

      - name: Verify applied local gameplay overlays
        run: |
          logic='work/Mindustry/core/src/mindustry/core/Logic.java'
          local_runtime='web-runtime/src/main/java/mindustry/web/BrowserLocalMapRuntime.java'
          browser_app='web-runtime/src/main/java/mindustry/web/BrowserApplication.java'
          grep -Fq 'Local attack-mode maps are supported on Web; preserve the selected map rule.' "$local_runtime"
          grep -Fq 'int countAlive = state.teams.getActive().count(t -> t.isAlive() && t.team != Team.derelict);' "$logic"
          grep -Fq 'stock buildAi/rtsAi/prebuildAi/fillItems are now supported by the Web loop.' "$local_runtime"
          grep -Fq 'if(data.rtsAi == null) data.rtsAi = new RtsAI(data);' "$logic"
          grep -Fq 'if(data.buildAi == null) data.buildAi = new BaseBuilderAI(data);' "$logic"
          grep -Fq 'Vars.state.isPlaying() && !Vars.state.gameOver' "$browser_app"
          echo 'Local Attack + stock Team AI + Yandex Game Over lifecycle applied before TeaVM compile'

      - name: Verify applied Web renderer hot-path patch
        run: |
          sprite='work/Arc/arc-core/src/arc/graphics/g2d/SpriteBatch.java'
          grep -Fq 'int[] sortOrder = new int[0], sortScratch = new int[0];' "$sprite"
          grep -Fq 'int[] runs = contiguous;' "$sprite"
          grep -Fq 'dst[out++] = za <= zb ? src[a++] : src[b++];' "$sprite"
          grep -Fq 'System.arraycopy(requests, pos, copy, ptr, length);' "$sprite"
          if grep -Fq 'long[] sortKeys' "$sprite"; then
            echo 'Web SpriteBatch regressed to TeaVM long-key sorting.' >&2
            exit 1
          fi
          if grep -Fq 'commonPool = new ForkJoinHolder();' "$sprite"; then
            echo 'Web SpriteBatch unexpectedly initializes the JVM ForkJoin sorter.' >&2
            exit 1
          fi

      - name: Compile Arc Web backend
        working-directory: work/Arc
        run: |
          chmod +x gradlew
          ./gradlew :arc-core:compileJava :backends:backend-web:compileJava --no-daemon --stacktrace

      - name: Compile Mindustry core bytecode for TeaVM reachability
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew core:compileJava --no-daemon --stacktrace
          test -s core/build/classes/java/main/mindustry/core/Version.class

      - name: Compile current Mindustry and Arc bytecode with TeaVM
        run: work/Arc/gradlew -p web-runtime generateJavaScript stageWeb --no-daemon --stacktrace

      - name: Remove TeaVM runtime documentation link
        run: python3 scripts/sanitize-teavm-runtime-links.py

      - name: Validate staged browser smoke package
        run: |
          test -s web-runtime/build/web/index.html
          test -s web-runtime/build/web/mindustry.js
          test -z "$(find web-runtime/build/web -type f -name '*.map' -print -quit)"
          test -s web-runtime/build/web/yandex-platform.js
          test -s web-runtime/build/web/browser-storage.js
          test -s web-runtime/build/web/browser-audio.js
          test -s web-runtime/build/web/assets-manifest.js
          test -s web-runtime/build/web/assets/sounds/ui/uiButton.ogg
          test -s web-runtime/build/web/assets/logicids.dat
          test -s web-runtime/build/web/licenses/Mindustry-GPL-3.0.txt
          test -s web-runtime/build/web/licenses/Arc-Apache-2.0.txt
          test -s web-runtime/build/web/licenses/SOURCE-NOTICE.txt
          test -s web-runtime/build/web/licenses/upstream.lock
          test -s web-runtime/build/web/assets/sprites/clouds.png
          test -s web-runtime/build/web/assets/sprites/rays.png
          test -s web-runtime/build/web/assets/sprites/distortAlpha.png
          test -s web-runtime/build/web/assets/sprites/error.png
          test -s web-runtime/build/web/assets/sprites/block_colors.png
          test -s web-runtime/build/web/assets/sprites/sprites.aatls
          test -s web-runtime/build/web/assets/sprites/sprites.png
          test -s web-runtime/build/web/assets/bundles/bundle.properties
          test -s web-runtime/build/web/assets/bundles/bundle_ru.properties
          test -s web-runtime/build/web/assets/icons/icons.properties
          test -s web-runtime/build/web/assets/locales
          grep -qx 'en' web-runtime/build/web/assets/locales
          grep -qx 'ru' web-runtime/build/web/assets/locales
          test "$(wc -l < web-runtime/build/web/assets/locales)" -eq 2
          for name in default outline monospace icon iconLarge tech logic; do
            test -s "web-runtime/build/web/assets/webfonts/$name.fnt"
            test -s "web-runtime/build/web/assets/webfonts/$name-0.png"
            grep -q "webfonts/$name.fnt" web-runtime/build/web/assets-manifest.js
            grep -q "webfonts/$name-0.png" web-runtime/build/web/assets-manifest.js
          done
          test ! -e web-runtime/build/web/assets/fonts/font.woff
          test ! -e web-runtime/build/web/assets/fonts/monospace.woff
          test ! -e web-runtime/build/web/assets/fonts/icon.ttf
          test ! -e web-runtime/build/web/assets/fonts/logic.ttf
          test ! -e web-runtime/build/web/assets/fonts/tech.ttf
          grep -q 'mindustry-canvas' web-runtime/build/web/index.html
          grep -q 'mindustry-web-status' web-runtime/build/web/index.html
          grep -q 'data-mindustry-network' web-runtime/build/web/index.html
          grep -q 'data-mindustry-storage' web-runtime/build/web/index.html
          grep -q 'data-mindustry-audio' web-runtime/build/web/index.html
          grep -q 'browser-storage.js' web-runtime/build/web/index.html
          grep -q 'browser-audio.js' web-runtime/build/web/index.html
          grep -q 'assets-manifest.js' web-runtime/build/web/index.html
          grep -q 'sounds/ui/uiButton.ogg' web-runtime/build/web/assets-manifest.js
          grep -q 'logicids.dat' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/clouds.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/rays.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/distortAlpha.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/error.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/block_colors.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/sprites.aatls' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/sprites.png' web-runtime/build/web/assets-manifest.js
          grep -q 'bundles/bundle.properties' web-runtime/build/web/assets-manifest.js
          grep -q 'bundles/bundle_ru.properties' web-runtime/build/web/assets-manifest.js
          grep -q 'icons/icons.properties' web-runtime/build/web/assets-manifest.js
          grep -q 'locales' web-runtime/build/web/assets-manifest.js
          echo "TeaVM JS bytes: $(wc -c < web-runtime/build/web/mindustry.js)"
          echo "Staged AATLS bytes: $(wc -c < web-runtime/build/web/assets/sprites/sprites.aatls)"
          echo "Staged atlas pages: $(find web-runtime/build/web/assets/sprites -maxdepth 1 -type f -name 'sprites*.png' | wc -l)"
          echo "Total baked font PNGs: $(find web-runtime/build/web/assets/webfonts -maxdepth 1 -type f -name '*.png' | wc -l)"

      - name: Enforce self-contained no-links Yandex package
        run: |
          if grep -REn --include='*.html' --include='*.css' --include='*.fnt' --include='*.properties' --include='*.js' 'https?://|wss?://' web-runtime/build/web; then
            echo 'External URL found in deployable HTML/CSS/font/bundle/JavaScript files.' >&2
            exit 1
          fi
          if grep -RFn 'Core.app.openURI(' work/Mindustry/core/src/mindustry/ui work/Mindustry/core/src/mindustry/editor; then
            echo 'Direct external navigation call remained in patched UI/editor source.' >&2
            exit 1
          fi
          grep -q "requireLocal(input, 'fetch')" web-runtime/build/web/index.html
          grep -q "data-mindustry-network', 'local-only'" web-runtime/build/web/index.html
          echo 'Deployable package contains no external URL literals in staged HTML/CSS/BMFont/bundles/JavaScript.'

      - name: Audit Yandex release package requirements
        run: bash scripts/audit-yandex-release.sh

      - name: Audit browser performance budget
        run: python3 scripts/audit-web-performance.py

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-performance-report
          path: work/web-performance-report.txt
          if-no-files-found: warn

      - name: Execute integrated desktop and mobile runtime in headless Chrome
        # Cold browser audio decode occasionally exceeds 45s on shared runners even when
        # the same commit passes the full release matrix. Keep every readiness marker,
        # but allow bounded startup variance before declaring the runtime unhealthy.
        run: |
          command -v google-chrome
          rm -rf /tmp/mindustry-web-main-profile /tmp/mindustry-web-mobile-profile
          cd web-runtime/build/web
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/mindustry-web-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 0.25
          done

          python3 "$GITHUB_WORKSPACE/scripts/chrome-wait-dom.py" \
            --url http://127.0.0.1:8080/index.html \
            --profile /tmp/mindustry-web-main-profile \
            --port 9224 \
            --timeout 75 \
            --require 'data-mindustry-web="ready"' \
            --require 'data-mindustry-storage="ready"' \
            --require 'data-mindustry-audio="ready"' \
            --require 'data-mindustry-ui-sync="ready"' \
            --require 'data-mindustry-renderer-init="ready"' \
            --require 'data-mindustry-control="ready"' \
            --require 'data-mindustry-gameplay-runtime="ready"' \
            --require 'data-mindustry-settings-ui="ready"' \
            --require 'data-mindustry-settings-panel="closed"' \
            --require 'data-mindustry-game-state-tick-smoke="ready"' \
            --require 'data-mindustry-network="local-only"' > /tmp/mindustry-web-dom.html
          cat /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-gl="webgl(1|2)"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-input="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-input-mode="desktop"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-device-mode="desktop"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-stock-input="desktop"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-audio="ready"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-audio-smoke-ms="[1-9][0-9]*"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-assets-preload="ready"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-assets-eager-bytes="[1-9][0-9]*"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-assets-preload-ms="[1-9][0-9]*"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-assets-preload-workers="[1-8]"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-renderer="constructed"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-renderer-init="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-control="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-control-saves="browser"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-gameplay-runtime="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-gameplay-loop="menu-stable"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-game-state-tick-smoke="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-fog-control="constructed-web-single-thread"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-pathfinder="constructed-web-single-thread"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-navigation="blocked"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-links="none"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-font="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-ui-shell="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-ui-sync="ready"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-locale="(en|ru)"' /tmp/mindustry-web-dom.html
          grep -q 'Mindustry core' /tmp/mindustry-web-dom.html
          grep -q 'Arc GL20 ready' /tmp/mindustry-web-dom.html
          grep -q 'binary-png@Core.files' /tmp/mindustry-web-dom.html
          grep -q 'texture-upload@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'vanilla-atlas@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'content-regions@atlas' /tmp/mindustry-web-dom.html
          grep -q 'sprite-frame@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'framebuffer-readback@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'settings@localStorage' /tmp/mindustry-web-dom.html

          # Exercise the production touch-first path. Apply device/touch/coarse
          # characteristics through CDP before index.html executes so BrowserApplication
          # detects mobile exactly as it does on a phone, without the legacy query override.
          python3 "$GITHUB_WORKSPACE/scripts/chrome-wait-dom.py" \
            --emulate-mobile \
            --url 'http://127.0.0.1:8080/index.html?lang=ru' \
            --profile /tmp/mindustry-web-mobile-profile \
            --port 9225 \
            --timeout 75 \
            --require 'data-mindustry-web="ready"' \
            --require 'data-mindustry-audio="ready"' \
            --require 'data-mindustry-device-source="browser-fallback"' \
            --require 'data-mindustry-input-mode="mobile"' \
            --require 'data-mindustry-device-mode="mobile"' \
            --require 'data-mindustry-stock-input="mobile"' \
            --require 'data-mindustry-renderer-init="ready"' \
            --require 'data-mindustry-control="ready"' \
            --require 'data-mindustry-gameplay-runtime="ready"' \
            --require 'data-mindustry-settings-ui="ready"' \
            --require 'data-mindustry-settings-panel="closed"' \
            --require 'data-mindustry-game-state-tick-smoke="ready"' \
            --require 'data-mindustry-network="local-only"' > /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-input="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-input-mode="mobile"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-device-mode="mobile"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-stock-input="mobile"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-audio="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-assets-preload="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -Eq 'data-mindustry-assets-eager-bytes="[1-9][0-9]*"' /tmp/mindustry-web-mobile-dom.html
          grep -Eq 'data-mindustry-assets-preload-ms="[1-9][0-9]*"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-renderer-init="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-control="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-gameplay-runtime="ready"' /tmp/mindustry-web-mobile-dom.html
          grep -q 'data-mindustry-game-state-tick-smoke="ready"' /tmp/mindustry-web-mobile-dom.html

      # Independent fresh-profile campaign proofs. Run them before the long localization/
      # persistence matrices so TechTree/map compatibility regressions fail fast.
      - name: Verify Yandex SDK lifecycle and fullscreen control
        run: bash scripts/verify-yandex-sdk.sh

      - name: Verify complete Erekir campaign through Origin capture
        run: bash scripts/verify-browser-erekir-progression.sh

      - name: Verify all Serpulo TechTree sectors through Weathered Channels
        run: bash scripts/verify-browser-campaign-capture.sh

      - name: Verify English and Russian browser localization
        run: bash scripts/verify-browser-locales.sh

      - name: Verify visible construction palette during real desktop/mobile gameplay
        run: bash scripts/verify-browser-palette-visibility.sh

      - name: Verify automatic desktop/mobile device detection
        run: bash scripts/verify-browser-device-autodetect.sh

      - name: Verify desktop/mobile resize and orientation continuity
        run: bash scripts/verify-browser-resize-orientation.sh

      - name: Verify game fits portal area beside advertising blocks
        run: bash scripts/verify-browser-portal-bounds.sh

      - name: Verify desktop/mobile runtime load stability
        run: bash scripts/verify-browser-runtime-load.sh

      - name: Upload runtime load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-load-report
          path: work/browser-runtime-load-report.txt
          if-no-files-found: warn

      - name: Verify persistent browser files across a real browser restart
        run: bash scripts/verify-browser-persistence.sh

      - name: Verify local pause save continue and autosave
        run: bash scripts/verify-browser-local-save.sh

      - name: Verify static fog persistence across cold Continue
        run: bash scripts/verify-browser-fog-persistence.sh

      - name: Verify active weather persistence across cold Continue
        run: bash scripts/verify-browser-weather-persistence.sh

      - name: Verify Sandbox cold Continue mode restoration
        run: bash scripts/verify-browser-sandbox-continue.sh

      - name: Verify real built-in local Attack mode
        run: bash scripts/verify-browser-local-attack.sh

      - name: Verify Attack cold Continue persistence
        run: bash scripts/verify-browser-attack-continue.sh

      - name: Verify campaign pause save and resume
        run: bash scripts/verify-browser-campaign-pause.sh

      # verify-browser-persistence already chains campaign cold save/resume, and
      # verify-browser-locales already chains the Yandex SDK desktop/mobile lifecycle.

      - name: Verify Erekir Onset boot and cold resume
        run: bash scripts/verify-browser-erekir-onset.sh

      - name: Upload localization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-i18n-report
          path: work/web-i18n-report.txt
          if-no-files-found: warn

      - name: Build deterministic Yandex release archive
        if: success()
        run: |
          python3 scripts/package-yandex-release.py
          cat work/release/mindustry-yandex-release-report.txt
          test -s work/release/mindustry-yandex-release.zip
          test -s work/release/mindustry-yandex-release.zip.sha256

      # Prove the archive is reproducible, not just consistently ordered. Touching
      # staged files changes filesystem mtimes but must not affect ZIP metadata,
      # bytes, the published digest sidecar, or the release report.
      - name: Verify byte-identical Yandex release repack
        if: success()
        run: |
          zip=work/release/mindustry-yandex-release.zip
          sidecar="$zip.sha256"
          report=work/release/mindustry-yandex-release-report.txt
          before_zip="$(sha256sum "$zip" | cut -d' ' -f1)"
          before_sidecar="$(sha256sum "$sidecar" | cut -d' ' -f1)"
          before_report="$(sha256sum "$report" | cut -d' ' -f1)"
          touch web-runtime/build/web/index.html web-runtime/build/web/yandex-platform.js
          python3 scripts/package-yandex-release.py
          test "$before_zip" = "$(sha256sum "$zip" | cut -d' ' -f1)"
          test "$before_sidecar" = "$(sha256sum "$sidecar" | cut -d' ' -f1)"
          test "$before_report" = "$(sha256sum "$report" | cut -d' ' -f1)"
          (cd work/release && sha256sum -c mindustry-yandex-release.zip.sha256)
          echo "Yandex release ZIP reproducibility (mtime-independent): PASS"

      - name: Verify packaged Yandex release archive
        if: success()
        run: bash scripts/verify-yandex-release-archive.sh

      - name: Upload Yandex release archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-yandex-release
          path: |
            work/release/mindustry-yandex-release.zip
            work/release/mindustry-yandex-release.zip.sha256
            work/release/mindustry-yandex-release-report.txt
          if-no-files-found: error

      - name: Upload browser smoke package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-web-smoke
          path: web-runtime/build/web
          if-no-files-found: error
