name: Web port baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-port-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned upstream sources
        run: bash scripts/bootstrap.sh

      - name: Verify legacy browser backend snapshot
        run: |
          test -d work/legacy-arc-web/backends/backend-gwt/src
          count="$(find work/legacy-arc-web/backends/backend-gwt/src -type f -name '*.java' | wc -l)"
          echo "Recovered legacy GWT Java files: $count"
          test "$count" -gt 20

      - name: Compile unmodified Mindustry core baseline
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew core:compileJava --no-daemon --stacktrace

      - name: Generate Web compatibility inventory
        if: always()
        run: bash scripts/audit-web-compat.sh

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-compat-report
          path: work/web-compat-report.txt
          if-no-files-found: error

  web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Bootstrap pinned upstream sources
        run: bash scripts/bootstrap.sh

      - name: Generate pinned vanilla sprite atlas
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew tools:pack '-Pargs=[]' --no-daemon --stacktrace
          test -s core/assets/sprites/sprites.aatls
          test -s core/assets/sprites/sprites.png
          pages="$(find core/assets/sprites -maxdepth 1 -type f -name 'sprites*.png' | wc -l)"
          echo "Vanilla AATLS bytes: $(wc -c < core/assets/sprites/sprites.aatls)"
          echo "Vanilla atlas pages: $pages"
          test "$pages" -gt 0

      - name: Bake browser-safe Mindustry UI font
        run: |
          bash scripts/install-web-font-baker.sh
          cd work/Mindustry
          chmod +x gradlew
          ./gradlew tools:webFontBake --no-daemon --stacktrace
          test -s core/assets/webfonts/default.fnt
          test -s core/assets/webfonts/default-0.png
          pages="$(find core/assets/webfonts -maxdepth 1 -type f -name 'default-*.png' | wc -l)"
          echo "Baked BMFont bytes: $(wc -c < core/assets/webfonts/default.fnt)"
          echo "Baked font pages: $pages"
          test "$pages" -gt 0

      - name: Apply current Web compatibility overlays
        run: |
          bash scripts/apply-port.sh
          python3 scripts/patch-arc-fi-web.py work/Arc/arc-core/src/arc/files/Fi.java
          python3 scripts/patch-mindustry-block-reflection.py work/Mindustry/core/src/mindustry/world/Block.java

      - name: Compile Arc Web backend
        working-directory: work/Arc
        run: |
          chmod +x gradlew
          ./gradlew :arc-core:compileJava :backends:backend-web:compileJava --no-daemon --stacktrace

      - name: Compile Mindustry core bytecode for TeaVM reachability
        working-directory: work/Mindustry
        run: |
          chmod +x gradlew
          ./gradlew core:compileJava --no-daemon --stacktrace
          test -s core/build/classes/java/main/mindustry/core/Version.class

      - name: Compile current Mindustry and Arc bytecode with TeaVM
        run: work/Arc/gradlew -p web-runtime generateJavaScript stageWeb --no-daemon --stacktrace

      - name: Validate staged browser smoke package
        run: |
          test -s web-runtime/build/web/index.html
          test -s web-runtime/build/web/mindustry.js
          test -s web-runtime/build/web/assets-manifest.js
          test -s web-runtime/build/web/assets/sprites/error.png
          test -s web-runtime/build/web/assets/sprites/block_colors.png
          test -s web-runtime/build/web/assets/sprites/sprites.aatls
          test -s web-runtime/build/web/assets/sprites/sprites.png
          test -s web-runtime/build/web/assets/webfonts/default.fnt
          test -s web-runtime/build/web/assets/webfonts/default-0.png
          test -s web-runtime/build/web/assets/bundles/bundle_ru.properties
          grep -q 'mindustry-canvas' web-runtime/build/web/index.html
          grep -q 'mindustry-web-status' web-runtime/build/web/index.html
          grep -q 'data-mindustry-network' web-runtime/build/web/index.html
          grep -q 'assets-manifest.js' web-runtime/build/web/index.html
          grep -q 'sprites/error.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/block_colors.png' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/sprites.aatls' web-runtime/build/web/assets-manifest.js
          grep -q 'sprites/sprites.png' web-runtime/build/web/assets-manifest.js
          grep -q 'webfonts/default.fnt' web-runtime/build/web/assets-manifest.js
          grep -q 'webfonts/default-0.png' web-runtime/build/web/assets-manifest.js
          grep -q 'bundles/bundle_ru.properties' web-runtime/build/web/assets-manifest.js
          echo "TeaVM JS bytes: $(wc -c < web-runtime/build/web/mindustry.js)"
          echo "PNG smoke bytes: $(wc -c < web-runtime/build/web/assets/sprites/error.png)"
          echo "Block colors bytes: $(wc -c < web-runtime/build/web/assets/sprites/block_colors.png)"
          echo "Staged AATLS bytes: $(wc -c < web-runtime/build/web/assets/sprites/sprites.aatls)"
          echo "Staged atlas pages: $(find web-runtime/build/web/assets/sprites -maxdepth 1 -type f -name 'sprites*.png' | wc -l)"
          echo "Staged font pages: $(find web-runtime/build/web/assets/webfonts -maxdepth 1 -type f -name 'default-*.png' | wc -l)"

      - name: Enforce self-contained Yandex package
        run: |
          # Deployment entrypoints/metadata must never contain an absolute external host.
          # Generated TeaVM bytecode may retain inert upstream URL strings, so behavior is
          # enforced separately at the Arc platform boundary and by the runtime network guard.
          if grep -REn --include='*.html' --include='*.css' --include='*.fnt' --include='assets-manifest.js' 'https?://|wss?://' web-runtime/build/web; then
            echo 'External URL found in deployable entrypoint/metadata.' >&2
            exit 1
          fi
          grep -q "requireLocal(input, 'fetch')" web-runtime/build/web/index.html
          grep -q "data-mindustry-network', 'local-only'" web-runtime/build/web/index.html

      - name: Execute Mindustry core, content, fonts, local-only network, input and settings in headless Chrome
        run: |
          command -v google-chrome
          cd web-runtime/build/web
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/mindustry-web-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 0.25
          done
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=20000 \
            --dump-dom \
            http://127.0.0.1:8080/index.html > /tmp/mindustry-web-dom.html
          cat /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-web="ready"' /tmp/mindustry-web-dom.html
          grep -Eq 'data-mindustry-gl="webgl(1|2)"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-input="ready"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-network="local-only"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-navigation="blocked"' /tmp/mindustry-web-dom.html
          grep -q 'data-mindustry-font="ready"' /tmp/mindustry-web-dom.html
          grep -q 'Mindustry core' /tmp/mindustry-web-dom.html
          grep -q 'Arc GL20 ready' /tmp/mindustry-web-dom.html
          grep -q 'binary-png@Core.files' /tmp/mindustry-web-dom.html
          grep -q 'texture-upload@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'vanilla-atlas@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'content-regions@atlas' /tmp/mindustry-web-dom.html
          grep -q 'sprite-frame@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'framebuffer-readback@WebGL' /tmp/mindustry-web-dom.html
          grep -q 'settings@localStorage' /tmp/mindustry-web-dom.html

      - name: Upload browser smoke package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-web-smoke
          path: web-runtime/build/web
          if-no-files-found: error
