<!doctype html>
<html lang="en" data-mindustry-web="booting" data-mindustry-network="installing" data-yandex-sdk="booting" data-mindustry-storage="booting">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mindustry</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111; color: #fff; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #mindustry-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
        #mindustry-web-status { position: fixed; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; opacity: .75; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="mindustry-canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="mindustry-web-status">Initializing Yandex Games and storage...</div>
    <script src="browser-storage.js"></script>
    <script src="yandex-platform.js"></script>
    <script>
        (async () => {
            const root = document.documentElement;
            const status = document.getElementById('mindustry-web-status');

            // Platform state and user-file hydration are independent. Finish both before
            // TeaVM starts so Arc's synchronous Fi API can read persistent files safely.
            await Promise.all([
                globalThis.__mindustryYandex.init(),
                globalThis.__mindustryStorage.init()
            ]);

            const blocked = [];
            globalThis.__mindustryExternalRequests = blocked;

            function resolveInput(input){
                const raw = input && typeof input === 'object' && typeof input.url === 'string'
                    ? input.url : String(input == null ? '' : input);
                return new URL(raw, location.href);
            }

            function requireLocal(input, kind){
                const url = resolveInput(input);
                const inline = url.protocol === 'data:' || url.protocol === 'blob:';
                const httpLocal = (url.protocol === 'http:' || url.protocol === 'https:') && url.origin === location.origin;
                const wsLocal = (url.protocol === 'ws:' || url.protocol === 'wss:') && url.hostname === location.hostname && url.port === location.port;
                if(inline || httpLocal || wsLocal) return url;
                const message = kind + ' blocked external URL: ' + url.href;
                blocked.push(message);
                root.setAttribute('data-mindustry-network', 'blocked');
                throw new Error(message);
            }

            if(!globalThis.__mindustryYandex.available){
                const nativeFetch = globalThis.fetch.bind(globalThis);
                globalThis.fetch = (input, init) => { requireLocal(input, 'fetch'); return nativeFetch(input, init); };

                if(globalThis.XMLHttpRequest){
                    const nativeOpen = XMLHttpRequest.prototype.open;
                    XMLHttpRequest.prototype.open = function(method, url, ...rest){ requireLocal(url, 'xhr'); return nativeOpen.call(this, method, url, ...rest); };
                }
                if(globalThis.WebSocket){
                    const NativeWebSocket = globalThis.WebSocket;
                    globalThis.WebSocket = function(url, protocols){ requireLocal(url, 'websocket'); return protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols); };
                    globalThis.WebSocket.prototype = NativeWebSocket.prototype;
                }
                if(globalThis.EventSource){
                    const NativeEventSource = globalThis.EventSource;
                    globalThis.EventSource = function(url, init){ requireLocal(url, 'eventsource'); return init === undefined ? new NativeEventSource(url) : new NativeEventSource(url, init); };
                    globalThis.EventSource.prototype = NativeEventSource.prototype;
                }
                if(navigator.sendBeacon){
                    const nativeBeacon = navigator.sendBeacon.bind(navigator);
                    navigator.sendBeacon = (url, data) => { requireLocal(url, 'beacon'); return nativeBeacon(url, data); };
                }
                root.setAttribute('data-mindustry-network', 'local-only');
            }else{
                root.setAttribute('data-mindustry-network', 'yandex-sdk-only');
            }

            const nativeWindowOpen = window.open.bind(window);
            window.open = (url, target, features) => {
                try{ requireLocal(url, 'window.open'); }
                catch(error){ console.warn(error.message); return null; }
                return nativeWindowOpen(url, target, features);
            };

            document.addEventListener('contextmenu', event => event.preventDefault(), {passive: false});
            document.addEventListener('selectstart', event => event.preventDefault(), {passive: false});

            function loadScript(path){
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = path;
                    script.async = false;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Local script load failed: ' + path));
                    document.body.appendChild(script);
                });
            }

            status.textContent = 'Loading Mindustry runtime...';
            await loadScript('assets-manifest.js');
            await loadScript('mindustry.js');

            const manifest = globalThis.__mindustryAssetManifest || [];
            const cache = Object.create(null);
            globalThis.__mindustryAssetCache = cache;
            let next = 0, loaded = 0;
            const workers = Math.max(1, Math.min(8, manifest.length));

            async function preloadWorker(){
                while(true){
                    const index = next++;
                    if(index >= manifest.length) return;
                    const path = manifest[index];
                    const url = 'assets/' + path;
                    const response = await fetch(url);
                    if(!response.ok) throw new Error('Asset preload failed (' + response.status + '): ' + url);
                    cache[url] = new Int8Array(await response.arrayBuffer());
                    loaded++;
                    status.textContent = 'Preloading Mindustry assets ' + loaded + '/' + manifest.length + '...';
                }
            }

            const tasks = [];
            for(let i = 0; i < workers; i++) tasks.push(preloadWorker());
            await Promise.all(tasks);
            status.textContent = 'Starting Mindustry...';
            main();
        })().catch(error => {
            const root = document.documentElement;
            if(root.getAttribute('data-mindustry-web') !== 'error'){
                root.setAttribute('data-mindustry-web', 'error');
                document.getElementById('mindustry-web-status').textContent = 'Mindustry Web bootstrap failed: ' + error;
            }
            console.error(error);
        });
    </script>
</body>
</html>
