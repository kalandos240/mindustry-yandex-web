<!doctype html>
<html lang="en" data-mindustry-web="booting" data-mindustry-network="installing" data-yandex-sdk="booting" data-mindustry-storage="booting" data-mindustry-audio="booting">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mindustry</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111; color: #fff; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        #mindustry-canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
        #mindustry-web-status { position: fixed; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; opacity: .75; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="mindustry-canvas" width="1280" height="720" tabindex="0"></canvas>
    <div id="mindustry-web-status">Initializing Yandex Games and storage...</div>
    <script src="browser-storage.js"></script>
    <script src="browser-audio.js"></script>
    <script src="yandex-platform.js"></script>
    <script>
        (async () => {
            const root = document.documentElement;
            const status = document.getElementById('mindustry-web-status');

            // Platform state and user-file hydration are independent. Finish both before
            // TeaVM starts so Arc's synchronous Fi API can read persistent files safely.
            await Promise.all([
                globalThis.__mindustryYandex.init(),
                globalThis.__mindustryStorage.init()
            ]);

            const blocked = [];
            globalThis.__mindustryExternalRequests = blocked;

            function resolveInput(input){
                const raw = input && typeof input === 'object' && typeof input.url === 'string'
                    ? input.url : String(input == null ? '' : input);
                return new URL(raw, location.href);
            }

            function requireLocal(input, kind){
                const url = resolveInput(input);
                const inline = url.protocol === 'data:' || url.protocol === 'blob:';
                const httpLocal = (url.protocol === 'http:' || url.protocol === 'https:') && url.origin === location.origin;
                const wsLocal = (url.protocol === 'ws:' || url.protocol === 'wss:') && url.hostname === location.hostname && url.port === location.port;
                if(inline || httpLocal || wsLocal) return url;
                const message = kind + ' blocked external URL: ' + url.href;
                blocked.push(message);
                root.setAttribute('data-mindustry-network', 'blocked');
                throw new Error(message);
            }

            if(!globalThis.__mindustryYandex.available){
                const nativeFetch = globalThis.fetch.bind(globalThis);
                globalThis.fetch = (input, init) => { requireLocal(input, 'fetch'); return nativeFetch(input, init); };

                if(globalThis.XMLHttpRequest){
                    const nativeOpen = XMLHttpRequest.prototype.open;
                    XMLHttpRequest.prototype.open = function(method, url, ...rest){ requireLocal(url, 'xhr'); return nativeOpen.call(this, method, url, ...rest); };
                }
                if(globalThis.WebSocket){
                    const NativeWebSocket = globalThis.WebSocket;
                    globalThis.WebSocket = function(url, protocols){ requireLocal(url, 'websocket'); return protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols); };
                    globalThis.WebSocket.prototype = NativeWebSocket.prototype;
                }
                if(globalThis.EventSource){
                    const NativeEventSource = globalThis.EventSource;
                    globalThis.EventSource = function(url, init){ requireLocal(url, 'eventsource'); return init === undefined ? new NativeEventSource(url) : new NativeEventSource(url, init); };
                    globalThis.EventSource.prototype = NativeEventSource.prototype;
                }
                if(navigator.sendBeacon){
                    const nativeBeacon = navigator.sendBeacon.bind(navigator);
                    navigator.sendBeacon = (url, data) => { requireLocal(url, 'beacon'); return nativeBeacon(url, data); };
                }
                root.setAttribute('data-mindustry-network', 'local-only');
            }else{
                root.setAttribute('data-mindustry-network', 'yandex-sdk-only');
            }

            const nativeWindowOpen = window.open.bind(window);
            window.open = (url, target, features) => {
                try{ requireLocal(url, 'window.open'); }
                catch(error){ console.warn(error.message); return null; }
                return nativeWindowOpen(url, target, features);
            };

            document.addEventListener('contextmenu', event => event.preventDefault(), {passive: false});
            document.addEventListener('selectstart', event => event.preventDefault(), {passive: false});

            function loadScript(path){
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = path;
                    script.async = false;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Local script load failed: ' + path));
                    document.body.appendChild(script);
                });
            }

            status.textContent = 'Loading Mindustry runtime...';
            await loadScript('assets-manifest.js');
            await loadScript('mindustry.js');

            const manifest = globalThis.__mindustryAssetManifest || [];
            const cache = Object.create(null);
            globalThis.__mindustryAssetCache = cache;

            // Arc's synchronous Fi bridge needs renderer/UI/content assets in memory before
            // main(). Audio is URL-backed. Campaign maps are only needed when a sector starts,
            // so normal production boot preloads Ground Zero/Onset and warms the remaining
            // maps in the background after main() begins. Full progression CI keeps all maps
            // eager to make deterministic multi-sector smoke independent of background timing.
            const params = new URLSearchParams(location.search);
            const forceCampaignEager = params.get('mindustryCampaignProgressSmoke') === '1';
            const isAudio = path => path.startsWith('sounds/') || path.startsWith('music/');
            const isCampaignMap = path => path.startsWith('maps/serpulo/') || path.startsWith('maps/erekir/');
            const isStartupCampaignMap = path =>
                path === 'maps/serpulo/groundZero.msav' || path === 'maps/erekir/onset.msav';

            const deferredCampaignManifest = forceCampaignEager ? [] :
                manifest.filter(path => isCampaignMap(path) && !isStartupCampaignMap(path));
            const deferredCampaignSet = new Set(deferredCampaignManifest);
            const eagerManifest = manifest.filter(path => !isAudio(path) && !deferredCampaignSet.has(path));
            const streamedAudio = manifest.filter(isAudio);

            root.setAttribute('data-mindustry-assets-eager', String(eagerManifest.length));
            root.setAttribute('data-mindustry-assets-streamed', String(streamedAudio.length));
            root.setAttribute('data-mindustry-assets-deferred-campaign', String(deferredCampaignManifest.length));
            root.setAttribute('data-mindustry-campaign-assets-policy',
                deferredCampaignManifest.length ? 'idle-background' : 'eager');
            root.setAttribute('data-mindustry-campaign-assets', deferredCampaignManifest.length ? 'pending' : 'ready');

            let next = 0, loaded = 0, loadedBytes = 0;
            const workers = Math.max(1, Math.min(8, eagerManifest.length));
            const preloadStarted = performance.now();
            root.setAttribute('data-mindustry-assets-preload-workers', String(workers));
            root.setAttribute('data-mindustry-assets-status-policy', 'batch-16');
            let statusUpdates = 0;

            async function preloadWorker(){
                while(true){
                    const index = next++;
                    if(index >= eagerManifest.length) return;
                    const path = eagerManifest[index];
                    const url = 'assets/' + path;
                    const response = await fetch(url);
                    if(!response.ok) throw new Error('Asset preload failed (' + response.status + '): ' + url);
                    const bytes = new Int8Array(await response.arrayBuffer());
                    cache[url] = bytes;
                    loadedBytes += bytes.byteLength;
                    loaded++;
                    if((loaded & 15) === 0 || loaded === eagerManifest.length){
                        status.textContent = 'Preloading Mindustry assets ' + loaded + '/' + eagerManifest.length + '...';
                        statusUpdates++;
                    }
                }
            }

            const tasks = [];
            for(let i = 0; i < workers; i++) tasks.push(preloadWorker());
            await Promise.all(tasks);
            root.setAttribute('data-mindustry-assets-eager-bytes', String(loadedBytes));
            root.setAttribute('data-mindustry-assets-preload-ms', String(Math.max(1, Math.round(performance.now() - preloadStarted))));
            root.setAttribute('data-mindustry-assets-status-updates', String(statusUpdates));
            root.setAttribute('data-mindustry-assets-preload', 'ready');
            status.textContent = 'Starting Mindustry...';

            async function warmCampaignMaps(){
                if(!deferredCampaignManifest.length) return;
                let cursor = 0, warmed = 0, warmedBytes = 0;
                const coarsePointer = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
                const touchMobile = coarsePointer || ((navigator.maxTouchPoints || 0) > 0 && Math.min(innerWidth, innerHeight) <= 820);
                const campaignWorkerCap = touchMobile ? 2 : 4;
                const campaignWorkers = Math.max(1, Math.min(campaignWorkerCap, deferredCampaignManifest.length));
                root.setAttribute('data-mindustry-campaign-assets-worker-policy', 'adaptive-2-mobile-4-desktop');
                root.setAttribute('data-mindustry-campaign-assets-workers', String(campaignWorkers));

                async function worker(){
                    while(true){
                        const index = cursor++;
                        if(index >= deferredCampaignManifest.length) return;
                        const path = deferredCampaignManifest[index];
                        const url = 'assets/' + path;
                        const response = await fetch(url);
                        if(!response.ok) throw new Error('Campaign map warmup failed (' + response.status + '): ' + url);
                        const bytes = new Int8Array(await response.arrayBuffer());
                        cache[url] = bytes;
                        warmedBytes += bytes.byteLength;
                        warmed++;
                    }
                }

                const jobs = [];
                for(let i = 0; i < campaignWorkers; i++) jobs.push(worker());
                await Promise.all(jobs);
                root.setAttribute('data-mindustry-campaign-assets-count', String(warmed));
                root.setAttribute('data-mindustry-campaign-assets-bytes', String(warmedBytes));
                root.setAttribute('data-mindustry-campaign-assets', 'ready');
            }

            if(deferredCampaignManifest.length){
                const startCampaignWarmup = () => {
                    root.setAttribute('data-mindustry-campaign-assets', 'loading');
                    warmCampaignMaps().catch(error => {
                        root.setAttribute('data-mindustry-campaign-assets', 'error');
                        console.error(error);
                    });
                };
                if(typeof globalThis.requestIdleCallback === 'function'){
                    globalThis.requestIdleCallback(startCampaignWarmup, {timeout: 1500});
                }else{
                    setTimeout(startCampaignWarmup, 250);
                }
            }

            main();
        })().catch(error => {
            const root = document.documentElement;
            if(root.getAttribute('data-mindustry-web') !== 'error'){
                root.setAttribute('data-mindustry-web', 'error');
                document.getElementById('mindustry-web-status').textContent = 'Mindustry Web bootstrap failed: ' + error;
            }
            console.error(error);
        });
    </script>
</body>
</html>
