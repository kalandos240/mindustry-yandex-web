<!doctype html>
<html lang="en" data-mindustry-web="booting" data-mindustry-network="installing" data-playgama-sdk="booting" data-yandex-sdk="booting" data-mindustry-storage="booting" data-mindustry-audio="booting">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mindustry</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111; color: #fff; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        /* Center the actual gameplay rectangle INSIDE the platform's iframe,
           never within the surrounding Yandex page or its advertising column.
           Without centering, the 2:1 desktop limit makes a console-shortened
           viewport appear to chop hundreds of pixels off the RIGHT side. */
        body { display: flex; align-items: center; justify-content: center; }
        #mindustry-game-surface { position: relative; box-sizing: border-box; flex: none; width: 100%; height: 100%; overflow: hidden; }
        /* Yandex 1.6.2.1-2: occupy the available height or width up to a 2:1
           active-field ratio. Use container-relative percentages and current
           viewport units (not fixed 1280x720); the real canvas and Arc viewport
           are refitted by ResizeObserver on every DevTools/fullscreen change. */
        @media (pointer: fine) {
            #mindustry-game-surface { max-width: 200vh; max-height: 200vw; max-width: 200dvh; max-height: 200dvw; }
        }
        #mindustry-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
        #mindustry-web-status { position: absolute; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; opacity: .75; pointer-events: none; }
    </style>
</head>
<body>
    <main id="mindustry-game-surface">
        <canvas id="mindustry-canvas" width="1280" height="720" tabindex="0"></canvas>
        <div id="mindustry-web-status">Initializing Playgama Bridge and storage...</div>
    </main>
    <script src="browser-storage.js"></script>
    <script src="browser-audio.js"></script>
    <script src="yandex-platform.js"></script>
    <script>
(function installBrowserErrorReport(){
    'use strict';
    const root=document.documentElement;
    let panel;
    function javaValue(error){
        if(!error || (typeof error!=='object' && typeof error!=='function')) return null;
        const key=Object.getOwnPropertySymbols(error).find(s=>s.description==='javaException');
        return key ? error[key] : null;
    }
    function describe(error){
        const chain=[],seen=new Set();
        let value=javaValue(error);
        while(value && !seen.has(value) && chain.length<12){
            seen.add(value);
            const fields=Object.entries(value);
            const message=fields.find(([name])=>name.startsWith('$message'))?.[1];
            chain.push({type:value.constructor?.name || 'JavaException',
                message:typeof message==='string'?message:message?.$nativeString || '',
                stack:value.$jsException?.stack || ''});
            value=fields.find(([name])=>name.startsWith('$cause'))?.[1];
        }
        if(!chain.length) chain.push({type:error?.name || 'Error',message:String(error?.message || error),stack:error?.stack || ''});
        return {format:'mindustry-web-error-v1',phase:root.getAttribute('data-mindustry-campaign-phase'),
            framePhase:root.getAttribute('data-mindustry-frame-stage'),
            sector:root.getAttribute('data-mindustry-campaign-preset'),
            viewport:{width:innerWidth,height:innerHeight},causes:chain};
    }
    function capture(error){
        try{
            // A host SDK may forward the same failure as a plain Error later.
            // Preserve the original Java causes instead of replacing them with c:97.
            if(!javaValue(error) && globalThis.__mindustryErrorReport?.causes.length>1) return;
            const report=describe(error);
            globalThis.__mindustryErrorReport=report;
            root.setAttribute('data-mindustry-error-causes',JSON.stringify(report.causes.map(c=>({type:c.type,message:c.message}))));
            console.error('Mindustry error report:',JSON.stringify(report));
            if(panel) return;
            const ru=new URLSearchParams(location.search).get('lang')==='ru' || /^ru\b/i.test(navigator.language || '');
            panel=document.createElement('div');panel.id='mindustry-error-actions';
            panel.style.cssText='position:fixed;z-index:2147483647;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px;background:#20242cf2;color:white;font:16px sans-serif';
            const label=document.createElement('span');label.textContent=ru?'Ошибка игры. Можно скопировать отчёт и перезагрузить страницу.':'Game error. Copy the report or reload the page.';panel.appendChild(label);
            const copy=document.createElement('button');copy.textContent=ru?'Скопировать отчёт':'Copy report';
            copy.onclick=async function(){
                const text=JSON.stringify(globalThis.__mindustryErrorReport,null,2);
                try{
                    if(!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
                    await navigator.clipboard.writeText(text);
                    copy.textContent=ru?'Скопировано':'Copied';
                }catch(ignored){
                    const box=document.createElement('textarea');box.value=text;box.setAttribute('readonly','');
                    box.style.cssText='width:100%;height:110px';panel.appendChild(box);box.focus();box.select();
                    try{document.execCommand('copy');}catch(ignored){}
                    copy.textContent=ru?'Отчёт выделен':'Report selected';
                }
            };
            const reload=document.createElement('button');reload.textContent=ru?'Перезагрузить':'Reload';reload.onclick=()=>location.reload();
            panel.appendChild(copy);panel.appendChild(reload);document.body.appendChild(panel);
        }catch(ignored){}
    }
    globalThis.__mindustryCaptureError=capture;
    addEventListener('error',event=>{
        if(javaValue(event.error) || root.getAttribute('data-mindustry-web')==='error') capture(event.error || event.message);
    },true);
    addEventListener('unhandledrejection',event=>{
        if(javaValue(event.reason)) capture(event.reason);
    });
})();

        (async () => {
            const root = document.documentElement;
            const status = document.getElementById('mindustry-web-status');

            // Platform state and user-file hydration are independent. Finish both before
            // TeaVM starts so Arc's synchronous Fi API can read persistent files safely.
            await Promise.all([
                globalThis.__mindustryYandex.init(),
                globalThis.__mindustryStorage.init()
            ]);
            // Restore a cloud checkpoint only before TeaVM starts, so Arc sees one
            // coherent synchronous settings/files snapshot from its first frame.
            await globalThis.__mindustryYandex.restoreCloudCheckpoint();

            const blocked = [];
            globalThis.__mindustryExternalRequests = blocked;

            function resolveInput(input){
                const raw = input && typeof input === 'object' && typeof input.url === 'string'
                    ? input.url : String(input == null ? '' : input);
                return new URL(raw, location.href);
            }

            function requireLocal(input, kind){
                const url = resolveInput(input);
                const inline = url.protocol === 'data:' || url.protocol === 'blob:';
                const httpLocal = (url.protocol === 'http:' || url.protocol === 'https:') && url.origin === location.origin;
                const wsLocal = (url.protocol === 'ws:' || url.protocol === 'wss:') && url.hostname === location.hostname && url.port === location.port;
                if(inline || httpLocal || wsLocal) return url;
                const message = kind + ' blocked external URL: ' + url.href;
                blocked.push(message);
                root.setAttribute('data-mindustry-network', 'blocked');
                throw new Error(message);
            }

            if(!globalThis.__mindustryYandex.available){
                const nativeFetch = globalThis.fetch.bind(globalThis);
                globalThis.fetch = (input, init) => { requireLocal(input, 'fetch'); return nativeFetch(input, init); };

                if(globalThis.XMLHttpRequest){
                    const nativeOpen = XMLHttpRequest.prototype.open;
                    XMLHttpRequest.prototype.open = function(method, url, ...rest){ requireLocal(url, 'xhr'); return nativeOpen.call(this, method, url, ...rest); };
                }
                if(globalThis.WebSocket){
                    const NativeWebSocket = globalThis.WebSocket;
                    globalThis.WebSocket = function(url, protocols){ requireLocal(url, 'websocket'); return protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols); };
                    globalThis.WebSocket.prototype = NativeWebSocket.prototype;
                }
                if(globalThis.EventSource){
                    const NativeEventSource = globalThis.EventSource;
                    globalThis.EventSource = function(url, init){ requireLocal(url, 'eventsource'); return init === undefined ? new NativeEventSource(url) : new NativeEventSource(url, init); };
                    globalThis.EventSource.prototype = NativeEventSource.prototype;
                }
                if(navigator.sendBeacon){
                    const nativeBeacon = navigator.sendBeacon.bind(navigator);
                    navigator.sendBeacon = (url, data) => { requireLocal(url, 'beacon'); return nativeBeacon(url, data); };
                }
                root.setAttribute('data-mindustry-network', 'local-only');
            }else{
                root.setAttribute('data-mindustry-network', 'playgama-sdk-only');
            }

            const nativeWindowOpen = window.open.bind(window);
            window.open = (url, target, features) => {
                try{ requireLocal(url, 'window.open'); }
                catch(error){ console.warn(error.message); return null; }
                return nativeWindowOpen(url, target, features);
            };

            document.addEventListener('contextmenu', event => event.preventDefault(), {passive: false});
            document.addEventListener('selectstart', event => event.preventDefault(), {passive: false});

            function loadScript(path){
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = path;
                    script.async = false;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('Local script load failed: ' + path));
                    document.body.appendChild(script);
                });
            }

            status.textContent = 'Loading Mindustry runtime...';
            await loadScript('assets-manifest.js');
            await loadScript('mindustry.js');

            const manifest = globalThis.__mindustryAssetManifest || [];
            globalThis.__mindustryAssetSet = new Set(manifest);
            root.setAttribute('data-mindustry-asset-index', 'set');
            const cache = Object.create(null);
            globalThis.__mindustryAssetCache = cache;
            // Bound the complete body, not just receipt of the HTTP headers.
            async function fetchAssetBytes(url){
                const controller = new AbortController();
                let timer;
                const timeout = new Promise((resolve, reject) => {
                    timer = setTimeout(() => {
                        controller.abort();
                        reject(new Error('Asset load timed out; reload to retry: ' + url));
                    }, 30000);
                });
                const download = (async () => {
                    const response = await fetch(url, {signal: controller.signal});
                    if(!response.ok) throw new Error('Asset load failed (' + response.status + '): ' + url);
                    return new Int8Array(await response.arrayBuffer());
                })();
                try{
                    return await Promise.race([download, timeout]);
                }finally{
                    clearTimeout(timer);
                }
            }

            const campaignRequests = new Map();
            // Share foreground launches with background warmup, including retries.
            globalThis.__mindustryPrepareCampaignMap = path => {
                if(!globalThis.__mindustryAssetSet.has(path)) return Promise.reject(new Error('Unpackaged campaign map: ' + path));
                const url = 'assets/' + path;
                if(cache[url]) return Promise.resolve();
                if(campaignRequests.has(path)) return campaignRequests.get(path);
                const controller = new AbortController();
                let timer;
                const timeout = new Promise((resolve, reject) => {
                    timer = setTimeout(() => {
                        controller.abort();
                        reject(new Error('Campaign map load timed out; retry: ' + path));
                    }, 20000);
                });
                const download = (async () => {
                    const response = await fetch(url, {signal:controller.signal});
                    if(!response.ok) throw new Error('Campaign map load failed (' + response.status + '): ' + url);
                    const bytes = new Int8Array(await response.arrayBuffer());
                    if(bytes.byteLength < 128) throw new Error('Incomplete campaign map: ' + path);
                    return bytes;
                })();
                const request = Promise.race([download, timeout]).then(bytes => {
                    cache[url] = bytes;
                }).finally(() => clearTimeout(timer));
                campaignRequests.set(path, request);
                const clear = () => { if(campaignRequests.get(path)===request) campaignRequests.delete(path); };
                request.then(clear, clear);
                return request;
            };

            // Arc's synchronous Fi bridge needs renderer/UI/content assets in memory before
            // main(). Audio is URL-backed. Campaign maps are only needed when a sector starts,
            // so normal production boot preloads Ground Zero/Onset and warms the remaining
            // maps in the background after main() begins. Full progression CI keeps all maps
            // eager to make deterministic multi-sector smoke independent of background timing.
            const params = new URLSearchParams(location.search);
            // Full 46-sector map CI must preload ALL stock .msav files before
            // any Java sector boot. Normal Playgama launches still defer 44 maps.
            const forceCampaignEager = params.get('mindustryCampaignProgressSmoke') === '1' ||
                params.get('mindustryCampaignMapMatrix') === '1';
            const isAudio = path => path.startsWith('sounds/') || path.startsWith('music/');
            const isCampaignMap = path => path.startsWith('maps/serpulo/') || path.startsWith('maps/erekir/');
            const isStartupCampaignMap = path =>
                path === 'maps/serpulo/groundZero.msav' || path === 'maps/erekir/onset.msav';

            const deferredCampaignManifest = forceCampaignEager ? [] :
                manifest.filter(path => isCampaignMap(path) && !isStartupCampaignMap(path));
            const deferredCampaignSet = new Set(deferredCampaignManifest);
            const eagerManifest = manifest.filter(path => !isAudio(path) && !deferredCampaignSet.has(path));
            const streamedAudio = manifest.filter(isAudio);

            root.setAttribute('data-mindustry-assets-eager', String(eagerManifest.length));
            root.setAttribute('data-mindustry-assets-streamed', String(streamedAudio.length));
            root.setAttribute('data-mindustry-assets-deferred-campaign', String(deferredCampaignManifest.length));
            root.setAttribute('data-mindustry-campaign-assets-policy',
                deferredCampaignManifest.length ? 'idle-background' : 'eager');
            root.setAttribute('data-mindustry-campaign-assets', deferredCampaignManifest.length ? 'pending' : 'ready');

            let next = 0, loaded = 0, loadedBytes = 0;
            const coarsePointer = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
            const touchMobile = coarsePointer || ((navigator.maxTouchPoints || 0) > 0 && Math.min(innerWidth, innerHeight) <= 820);
            const preloadWorkerCap = touchMobile ? 4 : 8;
            const workers = Math.max(1, Math.min(preloadWorkerCap, eagerManifest.length));
            const preloadStarted = performance.now();
            root.setAttribute('data-mindustry-assets-preload-worker-policy', 'adaptive-4-mobile-8-desktop');
            root.setAttribute('data-mindustry-assets-preload-workers', String(workers));
            root.setAttribute('data-mindustry-assets-status-policy', 'batch-16');
            let statusUpdates = 0;

            async function preloadWorker(){
                while(true){
                    const index = next++;
                    if(index >= eagerManifest.length) return;
                    const path = eagerManifest[index];
                    const url = 'assets/' + path;
                    const bytes = await fetchAssetBytes(url);
                    cache[url] = bytes;
                    loadedBytes += bytes.byteLength;
                    loaded++;
                    if((loaded & 15) === 0 || loaded === eagerManifest.length){
                        status.textContent = 'Preloading Mindustry assets ' + loaded + '/' + eagerManifest.length + '...';
                        statusUpdates++;
                    }
                }
            }

            const tasks = [];
            for(let i = 0; i < workers; i++) tasks.push(preloadWorker());
            await Promise.all(tasks);
            root.setAttribute('data-mindustry-assets-eager-bytes', String(loadedBytes));
            root.setAttribute('data-mindustry-assets-preload-ms', String(Math.max(1, Math.round(performance.now() - preloadStarted))));
            root.setAttribute('data-mindustry-assets-status-updates', String(statusUpdates));
            root.setAttribute('data-mindustry-assets-preload', 'ready');
            status.textContent = 'Starting Mindustry...';

            async function warmCampaignMaps(){
                if(!deferredCampaignManifest.length) return;
                let cursor = 0, warmed = 0, warmedBytes = 0, failed = 0;
                const campaignWorkerCap = touchMobile ? 2 : 4;
                const campaignWorkers = Math.max(1, Math.min(campaignWorkerCap, deferredCampaignManifest.length));
                root.setAttribute('data-mindustry-campaign-assets-worker-policy', 'adaptive-2-mobile-4-desktop');
                root.setAttribute('data-mindustry-campaign-assets-workers', String(campaignWorkers));

                async function worker(){
                    while(true){
                        const index = cursor++;
                        if(index >= deferredCampaignManifest.length) return;
                        const path = deferredCampaignManifest[index];
                        const url = 'assets/' + path;
                        try{
                            await globalThis.__mindustryPrepareCampaignMap(path);
                            warmedBytes += cache[url] ? cache[url].byteLength : 0;
                            warmed++;
                        }catch(error){
                            // Continue the queue; foreground Go can retry this map.
                            failed++;
                            console.warn('Campaign map warmup deferred until Go:', path, error);
                        }
                        root.setAttribute('data-mindustry-campaign-assets-count', String(warmed));
                        root.setAttribute('data-mindustry-campaign-assets-failed', String(failed));
                    }
                }

                const jobs = [];
                for(let i = 0; i < campaignWorkers; i++) jobs.push(worker());
                await Promise.all(jobs);
                root.setAttribute('data-mindustry-campaign-assets-count', String(warmed));
                root.setAttribute('data-mindustry-campaign-assets-bytes', String(warmedBytes));
                root.setAttribute('data-mindustry-campaign-assets', failed ? 'partial' : 'ready');
            }

            if(deferredCampaignManifest.length){
                const startCampaignWarmup = () => {
                    // Audio is startup-critical while the remaining campaign maps are not.
                    // In production BrowserAudio becomes ready immediately; CI deliberately
                    // decodes a real packaged OGG first. Do not let four background map
                    // fetches compete with that validation on a constrained Chrome runner.
                    const audioState = root.getAttribute('data-mindustry-audio');
                    if(audioState !== 'ready' && audioState !== 'unsupported' && audioState !== 'error'){
                        setTimeout(startCampaignWarmup, 100);
                        return;
                    }
                    root.setAttribute('data-mindustry-campaign-assets', 'loading');
                    warmCampaignMaps().catch(error => {
                        root.setAttribute('data-mindustry-campaign-assets', 'error');
                        console.error(error);
                    });
                };
                if(typeof globalThis.requestIdleCallback === 'function'){
                    globalThis.requestIdleCallback(startCampaignWarmup, {timeout: 1500});
                }else{
                    setTimeout(startCampaignWarmup, 250);
                }
            }

            // Settings and game modes use native Arc controls. Keep only telemetry
            // here; DOM buttons used by the early port must not cover the original UI.
            globalThis.__mindustryInstallSettings = (action, sfx, music, effects, quality) => {
                root.setAttribute('data-mindustry-settings-ui','ready');
                root.setAttribute('data-mindustry-settings-pause-entry','ready');
                root.setAttribute('data-mindustry-settings-panel','closed');
                root.setAttribute('data-mindustry-settings-context','none');
                root.setAttribute('data-mindustry-settings-sfx-value',String(sfx));
                root.setAttribute('data-mindustry-settings-music-value',String(music));
                root.setAttribute('data-mindustry-settings-effects-value',effects ? 'on' : 'off');
                root.setAttribute('data-mindustry-settings-graphics-value',quality ? 'quality' : 'performance');
            };
            globalThis.__mindustryInstallLocalMode = (action, initial) => {
                globalThis.__mindustrySetLocalMode = mode =>
                    root.setAttribute('data-mindustry-local-mode-selection',mode === 1 ? 'sandbox' : 'survival');
                globalThis.__mindustrySetLocalMode(initial);
                root.setAttribute('data-mindustry-local-mode-ui','ready');
            };

            main();
        })().catch(error => {
            const root = document.documentElement;
            if(root.getAttribute('data-mindustry-web') !== 'error'){
                root.setAttribute('data-mindustry-web', 'error');
                document.getElementById('mindustry-web-status').textContent = 'Mindustry Web bootstrap failed: ' + error;
            }
            console.error(error);
        });
    </script>
</body>
</html>
