<!doctype html>
<html lang="en" data-mindustry-web="booting" data-mindustry-network="installing">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Mindustry Web</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: sans-serif; }
        #mindustry-canvas { display: block; width: 100vw; height: 100vh; }
        #mindustry-web-status { position: fixed; left: 12px; bottom: 12px; z-index: 2; font-size: 12px; opacity: .75; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="mindustry-canvas" width="1280" height="720"></canvas>
    <div id="mindustry-web-status">Booting Mindustry Web runtime...</div>
    <script>
        // Yandex build invariant: game-owned runtime traffic is local-only. Assets may
        // come from the uploaded archive (same origin), data: or blob:. Any attempt to
        // reach another host is recorded, blocked and therefore fails CI immediately.
        (() => {
            const root = document.documentElement;
            const blocked = [];
            globalThis.__mindustryExternalRequests = blocked;

            function resolveInput(input){
                const raw = input && typeof input === 'object' && typeof input.url === 'string'
                    ? input.url
                    : String(input == null ? '' : input);
                return new URL(raw, location.href);
            }

            function requireLocal(input, kind){
                const url = resolveInput(input);
                const inline = url.protocol === 'data:' || url.protocol === 'blob:';
                const httpLocal = (url.protocol === 'http:' || url.protocol === 'https:') && url.origin === location.origin;
                const wsLocal = (url.protocol === 'ws:' || url.protocol === 'wss:')
                    && url.hostname === location.hostname && url.port === location.port;
                if(inline || httpLocal || wsLocal) return url;

                const message = kind + ' blocked external URL: ' + url.href;
                blocked.push(message);
                root.setAttribute('data-mindustry-network', 'blocked');
                throw new Error(message);
            }

            const nativeFetch = globalThis.fetch.bind(globalThis);
            globalThis.fetch = (input, init) => {
                requireLocal(input, 'fetch');
                return nativeFetch(input, init);
            };

            if(globalThis.XMLHttpRequest){
                const nativeOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...rest){
                    requireLocal(url, 'xhr');
                    return nativeOpen.call(this, method, url, ...rest);
                };
            }

            if(globalThis.WebSocket){
                const NativeWebSocket = globalThis.WebSocket;
                globalThis.WebSocket = function(url, protocols){
                    requireLocal(url, 'websocket');
                    return protocols === undefined ? new NativeWebSocket(url) : new NativeWebSocket(url, protocols);
                };
                globalThis.WebSocket.prototype = NativeWebSocket.prototype;
            }

            if(globalThis.EventSource){
                const NativeEventSource = globalThis.EventSource;
                globalThis.EventSource = function(url, init){
                    requireLocal(url, 'eventsource');
                    return init === undefined ? new NativeEventSource(url) : new NativeEventSource(url, init);
                };
                globalThis.EventSource.prototype = NativeEventSource.prototype;
            }

            if(navigator.sendBeacon){
                const nativeBeacon = navigator.sendBeacon.bind(navigator);
                navigator.sendBeacon = (url, data) => {
                    requireLocal(url, 'beacon');
                    return nativeBeacon(url, data);
                };
            }

            const nativeWindowOpen = window.open.bind(window);
            window.open = (url, target, features) => {
                try{
                    requireLocal(url, 'window.open');
                }catch(error){
                    console.warn(error.message);
                    return null;
                }
                return nativeWindowOpen(url, target, features);
            };

            root.setAttribute('data-mindustry-network', 'local-only');
        })();
    </script>
    <script src="assets-manifest.js"></script>
    <script src="mindustry.js"></script>
    <script>
        (async () => {
            const status = document.getElementById('mindustry-web-status');
            const manifest = globalThis.__mindustryAssetManifest || [];
            const cache = Object.create(null);
            globalThis.__mindustryAssetCache = cache;

            let next = 0;
            let loaded = 0;
            const workers = Math.max(1, Math.min(8, manifest.length));

            async function preloadWorker(){
                while(true){
                    const index = next++;
                    if(index >= manifest.length) return;
                    const path = manifest[index];
                    const url = 'assets/' + path;
                    const response = await fetch(url);
                    if(!response.ok){
                        throw new Error('Asset preload failed (' + response.status + '): ' + url);
                    }
                    cache[url] = new Int8Array(await response.arrayBuffer());
                    loaded++;
                    status.textContent = 'Preloading Mindustry assets ' + loaded + '/' + manifest.length + '...';
                }
            }

            const tasks = [];
            for(let i = 0; i < workers; i++) tasks.push(preloadWorker());
            await Promise.all(tasks);

            status.textContent = 'Starting Mindustry Web runtime...';
            main();
        })().catch(error => {
            // Java startup stages report a much more precise failure through
            // BrowserCanvas.setStatus(). Do not overwrite that diagnostic with
            // TeaVM's occasionally opaque JS wrapper value (for example Error: null).
            const root = document.documentElement;
            if(root.getAttribute('data-mindustry-web') !== 'error'){
                root.setAttribute('data-mindustry-web', 'error');
                document.getElementById('mindustry-web-status').textContent = 'Mindustry Web asset bootstrap failed: ' + error;
            }
            console.error(error);
        });
    </script>
</body>
</html>
