plugins {
    id "java"
    id "org.teavm" version "0.15.0"
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation teavm.libs.jsoApis

    // Produced by the pinned upstream checkouts in CI/local bootstrap. Using
    // class directories keeps TeaVM tied to the exact source revisions in
    // upstream.lock instead of relying on separately published artifacts.
    // Mindustry's client startup graph reaches several Arc extension modules;
    // core:compileJava has already compiled these exact pinned sources.
    implementation files(
        "../work/Arc/arc-core/build/classes/java/main",
        "../work/Arc/backends/backend-web/build/classes/java/main",
        "../work/Arc/extensions/fx/build/classes/java/main",
        "../work/Arc/extensions/g3d/build/classes/java/main",
        "../work/Arc/extensions/flabel/build/classes/java/main",
        "../work/Arc/extensions/freetype/build/classes/java/main",
        "../work/Arc/extensions/arcnet/build/classes/java/main",
        "../work/Arc/extensions/packer/build/classes/java/main",
        "../work/Mindustry/core/build/classes/java/main"
    )
}

teavm {
    all {
        mainClass = "mindustry.web.Bootstrap"
    }
    js {
        targetFileName = "mindustry.js"
        obfuscated = false
        sourceMap = true
        strict = true
    }
}

tasks.register("stageWeb", Copy) {
    dependsOn "generateJavaScript"
    from "src/web"
    from "$buildDir/generated/teavm/js"
    // Real Mindustry packaged assets. The generated manifest is fetched
    // asynchronously by index.html before TeaVM main() is entered.
    from("../work/Mindustry/core/assets") {
        include "bundles/bundle.properties"
        include "planets/serpulo.json"
        include "sprites/error.png"
        include "sprites/block_colors.png"
        // Stage the vanilla font sources now, before the browser-specific bitmap
        // font bridge is installed. Keeping them in the package lets the next UI
        // milestone generate/load glyph atlases without any third-party request.
        include "fonts/font.woff"
        include "fonts/monospace.woff"
        include "fonts/icon.ttf"
        include "fonts/logic.ttf"
        include "fonts/tech.ttf"
        // Generated by pinned Mindustry's tools:pack task. Keep the binary Arc
        // atlas and every variable-count PNG page; do not hard-code page names.
        include "sprites/sprites.aatls"
        include "sprites/sprites*.png"
        into "assets"
    }
    into "$buildDir/web"

    doLast {
        File assetsDir = file("$buildDir/web/assets")
        def paths = fileTree(assetsDir).files
            .findAll { it.isFile() }
            .collect { assetsDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            .sort()
        String json = groovy.json.JsonOutput.toJson(paths)
        file("$buildDir/web/assets-manifest.js").setText("globalThis.__mindustryAssetManifest = ${json};\n", "UTF-8")
    }
}

tasks.named("assemble") {
    dependsOn "stageWeb"
}
