plugins {
    id "java"
    id "org.teavm" version "0.15.0"
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation teavm.libs.jsoApis
    implementation files(
        "../work/Arc/arc-core/build/classes/java/main",
        "../work/Arc/backends/backend-web/build/classes/java/main",
        "../work/Arc/extensions/fx/build/classes/java/main",
        "../work/Arc/extensions/g3d/build/classes/java/main",
        "../work/Arc/extensions/flabel/build/classes/java/main",
        "../work/Arc/extensions/freetype/build/classes/java/main",
        "../work/Arc/extensions/arcnet/build/classes/java/main",
        "../work/Arc/extensions/packer/build/classes/java/main",
        "../work/Mindustry/core/build/classes/java/main"
    )
}

teavm {
    all { mainClass = "mindustry.web.Bootstrap" }
    js {
        targetFileName = "mindustry.js"
        obfuscated = false
        sourceMap = true
        strict = true
    }
}

tasks.register("stageWeb", Copy) {
    dependsOn "generateJavaScript"
    from "src/web"
    from("$buildDir/generated/teavm/js") {
        // Keep source maps available in the build tree for debugging, but never ship
        // them to Yandex. They are not runtime assets and can consume substantial space.
        exclude "**/*.map"
    }
    from("../work/Mindustry/LICENSE") {
        into "licenses"
        rename { "Mindustry-GPL-3.0.txt" }
    }
    from("../work/Arc/LICENSE") {
        into "licenses"
        rename { "Arc-Apache-2.0.txt" }
    }
    from("../upstream.lock") {
        into "licenses"
    }
    from("../work/Mindustry/core/assets") {
        include "bundles/bundle.properties"
        include "bundles/bundle_ru.properties"

        // Planet definitions live in mindustry.content.Planets. In addition, tools:pack
        // generates Serpulo's vanilla PlanetData at build time because Serpulo sets
        // loadPlanetData=true and Planet.getData() reads planets/serpulo.json. Erekir
        // does not use that JSON path, so do not invent or stage an Erekir counterpart.
        include "planets/serpulo.json"

        include "logicids.dat"
        include "sprites/error.png"
        include "sprites/block_colors.png"

        // Package the original built-in local skirmish maps from the pinned Mindustry
        // release. They remain same-origin assets inside the Yandex upload and form the
        // first real user-controlled map/start surface after deterministic CI gameplay
        // was separated from normal production startup.
        include "maps/default/**"

        // All stock Serpulo TechTree sector assets are staged, including optional branches.
        // Only local preset maps are packaged; browser runtime remains server-free.
        include "maps/serpulo/groundZero.msav"
        include "maps/serpulo/frozenForest.msav"
        include "maps/serpulo/crateredBattleground.msav"
        include "maps/serpulo/ruinousShores.msav"
        include "maps/serpulo/windsweptIslands.msav"
        include "maps/serpulo/biomassFacility.msav"
        include "maps/serpulo/fungalPass.msav"
        include "maps/serpulo/frontier.msav"
        include "maps/serpulo/saltFlats.msav"
        include "maps/serpulo/tarFields.msav"
        include "maps/serpulo/impact0078.msav"
        include "maps/serpulo/stainedMountains.msav"
        include "maps/serpulo/infestedCanyons.msav"
        include "maps/serpulo/nuclearComplex.msav"
        include "maps/serpulo/desolateRift.msav"
        include "maps/serpulo/facility32m.msav"
        include "maps/serpulo/perilousHarbor.msav"
        include "maps/serpulo/extractionOutpost.msav"
        include "maps/serpulo/coastline.msav"
        include "maps/serpulo/navalFortress.msav"
        include "maps/serpulo/overgrowth.msav"
        include "maps/serpulo/mycelialBastion.msav"
        include "maps/serpulo/littoralShipyard.msav"
        include "maps/serpulo/planetaryTerminal.msav"
        include "maps/serpulo/taintedWoods.msav"
        include "maps/serpulo/atolls.msav"
        include "maps/serpulo/testingGrounds.msav"
        include "maps/serpulo/sunkenPier.msav"
        include "maps/serpulo/weatheredChannels.msav"

        // Complete stock Erekir preset progression through Origin.
        include "maps/erekir/onset.msav"
        include "maps/erekir/aegis.msav"
        include "maps/erekir/lake.msav"
        include "maps/erekir/intersect.msav"
        include "maps/erekir/atlas.msav"
        include "maps/erekir/split.msav"
        include "maps/erekir/basin.msav"
        include "maps/erekir/marsh.msav"
        include "maps/erekir/peaks.msav"
        include "maps/erekir/ravine.msav"
        include "maps/erekir/caldera-erekir.msav"
        include "maps/erekir/stronghold.msav"
        include "maps/erekir/crevice.msav"
        include "maps/erekir/siege.msav"
        include "maps/erekir/crossroads.msav"
        include "maps/erekir/karst.msav"
        include "maps/erekir/origin.msav"

        // Stock Renderer and Shaders must remain fully local. Shaders.init() consumes
        // shaders/** and its noise/caustics/space textures. Content.load() also queues
        // ParticleWeather noise textures before Renderer.init() drains the pending asset
        // graph. Renderer.init() then creates PlanetRenderer/Bloom, EnvRenderers and the
        // cloud texture, so package every asset reached by this startup milestone.
        include "shaders/**"
        include "bloomshaders/**"
        include "sprites/noise.png"
        include "sprites/noiseAlpha.png"
        include "sprites/fog.png"
        include "sprites/caustics.png"
        include "sprites/space.png"
        include "sprites/clouds.png"
        include "sprites/rays.png"
        include "sprites/distortAlpha.png"
        include "cubemaps/stars/**"

        // Stock UI.loadSync() registers content glyphs from this local index.
        // Cursor PNGs are deliberately not staged: WebGraphics makes cursor creation
        // a no-op for the touch-first Yandex target.
        include "icons/icons.properties"

        include "webfonts/*.fnt"
        include "webfonts/*.png"
        include "sprites/sprites.aatls"
        include "sprites/sprites*.png"

        // BrowserAudio keeps all audio inside the Yandex package. OGG files are excluded
        // from the eager Java byte[] preload in index.html; Web Audio decodes SFX lazily
        // and HTMLAudioElement streams music from these same-origin packaged paths.
        include "sounds/**/*.ogg"
        include "music/*.ogg"
        into "assets"
    }
    into "$buildDir/web"

    doLast {
        File assetsDir = file("$buildDir/web/assets")
        def paths = fileTree(assetsDir).files
            .findAll { it.isFile() }
            .collect { assetsDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            .sort()
        String json = groovy.json.JsonOutput.toJson(paths)
        file("$buildDir/web/assets-manifest.js").setText("globalThis.__mindustryAssetManifest = ${json};\n", "UTF-8")
    }
}

tasks.named("assemble") { dependsOn "stageWeb" }
