# TeaVM needs substantially more heap once the real Mindustry ClientLauncher graph
# becomes reachable. Keep this scoped to the Web runtime build; upstream Gradle
# settings remain untouched.
org.gradle.jvmargs=-Xms512m -Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.workers.max=1
org.gradle.parallel=false
